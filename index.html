<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreNode — 알림함 (청중)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font: 'Noto Sans KR', -apple-system, sans-serif;
  --accent: #36454F;
  --accent-light: #EEF1F2;
  --accent-mid: #D6DCDF;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --text-muted: #9CA3AF;
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --border-light: #F3F4F6;
  --green: #059669;
  --red: #DC2626;
  --orange: #D97706;
  --purple: #7C3AED;
  --yellow: #CA8A04;
  --trans: 0.22s cubic-bezier(.4,0,.2,1);
  --header: #36454F;
}

body {
  font-family: var(--font);
  background: #CBD5E1;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 16px 48px;
  gap: 32px;
}

/* ══════════════════════════════════
   PHONE FRAME
══════════════════════════════════ */
.phone {
  width: 375px;
  height: 812px;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.28), 0 0 0 10px #1a1a1a, 0 0 0 12px #333;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/* ── Status Bar ── */
.status-bar {
  background: var(--header);
  padding: 14px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.status-time {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}
.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Top Nav ── */
.topnav {
  background: var(--header);
  padding: 10px 20px 16px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.nav-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.9);
  background: none;
  border: none;
  cursor: pointer;
  border-radius: 50%;
  transition: background var(--trans);
}
.nav-back:hover { background: rgba(255,255,255,0.12); }

.nav-title {
  flex: 1;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
  padding-left: 4px;
}
.nav-bell {
  position: relative;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.9);
  cursor: pointer;
}
.bell-dot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #EF4444;
  border: 2px solid var(--header);
  transition: opacity var(--trans), transform var(--trans);
}
.bell-dot.gone {
  opacity: 0;
  transform: scale(0);
}

/* ── Tab Bar ── */
.tab-bar {
  background: var(--surface);
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 13px 0 12px;
  font-size: 14.5px;
  font-weight: 500;
  font-family: var(--font);
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  position: relative;
  transition: color var(--trans);
}
.tab-btn.active {
  color: var(--text-primary);
  font-weight: 700;
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 2.5px;
  background: var(--accent);
  border-radius: 2px 2px 0 0;
}

/* ── Tab Content ── */
.tab-content {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}
.tab-content.on { display: flex; }

/* ── Filter Bar (Tab 1 only) ── */
.filter-bar {
  background: #FAFAFA;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.fchip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--trans);
  line-height: 1;
}
.fchip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.mark-all-btn {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  font-size: 11.5px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--trans);
  white-space: nowrap;
}
.mark-all-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}
.mark-all-btn.hidden { display: none; }

/* ── Scrollable list ── */
.list-scroll {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.list-scroll::-webkit-scrollbar { width: 0; }

/* ── Notification Item ── */
.nitem {
  background: var(--surface);
  border-bottom: 1px solid var(--border-light);
  padding: 14px 16px;
  display: flex;
  align-items: stretch;
  gap: 12px;
  cursor: pointer;
  transition: background var(--trans);
}
.nitem:hover { background: #FAFAFA; }
.nitem.unread { background: #F4F8FF; }
.nitem.unread:hover { background: #ECF2FF; }

.nicon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.nicon.blue,
.nicon.green,
.nicon.purple,
.nicon.orange,
.nicon.red,
.nicon.yellow { background: #E8ECEE; color: #36454F; }

.nbody { flex: 1; min-width: 0; }

.ntitle {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.45;
  margin-bottom: 3px;
}
.nitem.unread .ntitle { font-weight: 600; }

.ndesc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.nmeta {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 0;
}
.nsender {
  font-size: 11px;
  color: var(--text-muted);
}
.nmeta-dot {
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
}
.ntime {
  font-size: 11px;
  color: var(--text-muted);
}

.nitem-right {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.unread-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #EF4444;
  flex-shrink: 0;
}
.nchevron {
  color: #C4CDD4;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

/* ── Date section label ── */
.date-label {
  padding: 8px 16px 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.4px;
  background: var(--bg);
}

/* ── Empty state ── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 32px;
  text-align: center;
  gap: 6px;
  color: var(--text-muted);
}
.empty-state svg { margin-bottom: 10px; opacity: 0.28; }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
.empty-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.65; }

/* ══════════════════════════════════
   TAB 2: NOTICE
══════════════════════════════════ */
.notice-wrap {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Notice Section Label ── */
.notice-section-label {
  padding: 8px 16px 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.3px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.ncard {
  background: var(--surface);
  border-bottom: 1px solid var(--border-light);
  padding: 14px 16px;
  cursor: pointer;
  transition: background var(--trans);
}
.ncard:hover { background: #FAFAFA; }
.ncard.pinned {
  background: #FFFBEB;
}
.ncard.pinned:hover { background: #FEF3C7; }

.ncard-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 6px;
}
.badge-important { background: #FEF3C7; color: #B45309; }

.ncard-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.45;
  margin-bottom: 4px;
}
.ncard-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ncard-time { font-size: 11px; color: var(--text-muted); }

/* ── Notice Detail (slide-in) ── */
.notice-detail {
  position: absolute;
  inset: 0;
  background: var(--surface);
  transform: translateX(100%);
  transition: transform var(--trans);
  display: flex;
  flex-direction: column;
  z-index: 10;
}
.notice-detail.open { transform: translateX(0); }

.nd-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.nd-back {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  padding: 4px 0;
  transition: opacity var(--trans);
}
.nd-back:hover { opacity: 0.7; }

.nd-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 24px;
}
.nd-body::-webkit-scrollbar { width: 0; }

.nd-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.nd-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.4;
  margin-bottom: 6px;
}
.nd-time {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.nd-content {
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.9;
  white-space: pre-line;
}

/* ══════════════════════════════════
   SIDE PANEL (메인 화면 벨 데모)
══════════════════════════════════ */
.demo-label {
  width: 100%;
  max-width: 260px;
  text-align: center;
}
.demo-label h3 {
  font-size: 13px;
  font-weight: 700;
  color: #374151;
  margin-bottom: 4px;
}
.demo-label p {
  font-size: 11.5px;
  color: #6B7280;
  line-height: 1.6;
  margin-bottom: 16px;
}

.demo-phone-mini {
  width: 220px;
  background: #1B4843;
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.demo-logo {
  flex: 1;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}
.demo-logo span { color: rgba(255,255,255,0.6); }
.demo-bell-wrap {
  position: relative;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.9);
  cursor: pointer;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  transition: background var(--trans);
}
.demo-bell-wrap:hover { background: rgba(255,255,255,0.18); }
.demo-bell-dot {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #EF4444;
  border: 2px solid #1B4843;
  transition: opacity 0.3s, transform 0.3s;
}
.demo-bell-dot.gone { opacity: 0; transform: scale(0); }

.demo-toggle-btn {
  display: block;
  width: 100%;
  padding: 9px;
  border-radius: 8px;
  border: 1.5px solid #D1D5DB;
  background: #fff;
  color: #374151;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  text-align: center;
  transition: all var(--trans);
  margin-top: 12px;
}
.demo-toggle-btn:hover {
  border-color: #2563EB;
  color: #2563EB;
  background: #EFF6FF;
}

</style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     메인 화면 벨 아이콘 데모 (오른쪽 패널)
═══════════════════════════════════════════ -->
<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:80px;gap:16px;">
  <div class="demo-label">
    <h3>메인 화면 벨 아이콘</h3>
    <p>새소식 있을 때 숫자 없이<br>컬러 도트(●)만 표시됩니다.</p>
    <div class="demo-phone-mini">
      <div class="demo-logo">Core<strong>Node</strong><span>.</span></div>
      <div class="demo-bell-wrap" id="demoBellWrap" onclick="toggleDemoDot()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <div class="demo-bell-dot" id="demoBellDot"></div>
      </div>
    </div>
    <button class="demo-toggle-btn" onclick="toggleDemoDot()" id="demoToggleBtn">
      ● 도트 숨기기 (읽음 처리 시뮬레이션)
    </button>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     청중 알림함 화면 (모바일 프레임)
═══════════════════════════════════════════ -->
<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <!-- Signal -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="rgba(255,255,255,0.85)">
        <rect x="0" y="8" width="3" height="4" rx="0.8"/>
        <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.8"/>
        <rect x="9" y="2.5" width="3" height="9.5" rx="0.8"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.8" opacity="0.3"/>
      </svg>
      <!-- WiFi -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="rgba(255,255,255,0.85)" stroke-linecap="round">
        <path d="M1 3.5C3.8 1.2 8 1 11 3.5" stroke-width="1.4" opacity="0.4"/>
        <path d="M3 6.2C4.9 4.6 7.5 4.5 9 6.2" stroke-width="1.4"/>
        <circle cx="6" cy="9.5" r="1.2" fill="rgba(255,255,255,0.85)" stroke="none"/>
      </svg>
      <!-- Battery -->
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
        <rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="rgba(255,255,255,0.5)"/>
        <rect x="1.5" y="1.5" width="16" height="9" rx="1.5" fill="rgba(255,255,255,0.85)"/>
        <path d="M21.5 4V8C22.4 7.6 23 6.9 23 6C23 5.1 22.4 4.4 21.5 4Z" fill="rgba(255,255,255,0.4)"/>
      </svg>
    </div>
  </div>

  <!-- Top Nav -->
  <div class="topnav">
    <button class="nav-back" onclick="alert('이전 화면으로 이동')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="nav-title">알림함</div>
    <div class="nav-bell">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <div class="bell-dot" id="mainBellDot"></div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-notif" onclick="switchTab('notif')">알림</button>
    <button class="tab-btn" id="tab-notice" onclick="switchTab('notice')">공지</button>
  </div>

  <!-- ── Tab 1: 알림 ── -->
  <div class="tab-content on" id="tc-notif">
    <div class="notice-wrap">
      <div class="filter-bar">
        <button class="fchip active" id="fc-all" onclick="setFilter('all')">전체</button>
        <button class="fchip" id="fc-unread" onclick="setFilter('unread')">안읽음<span id="unreadLabel"></span></button>
        <button class="mark-all-btn hidden" id="markAllBtn" onclick="markAllRead()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          모두 읽음
        </button>
      </div>
      <div class="list-scroll" id="notifList"></div>
      <!-- 알림 상세 (슬라이드 인, announcement 전용) -->
      <div class="notice-detail" id="notifDetail">
        <div class="nd-head">
          <button class="nd-back" onclick="closeNotifDetail()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            알림 목록
          </button>
        </div>
        <div class="nd-body">
          <div class="nd-tag" id="ndTag"></div>
          <div class="nd-title" id="ndTitle"></div>
          <div class="nd-time" id="ndTime"></div>
          <div class="nd-content" id="ndContent"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Tab 2: 공지 ── -->
  <div class="tab-content" id="tc-notice">
    <div class="notice-wrap">
      <div class="list-scroll" id="noticeList"></div>
      <!-- 공지 상세 (슬라이드 인) -->
      <div class="notice-detail" id="noticeDetail">
        <div class="nd-head">
          <button class="nd-back" onclick="closeDetail()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            공지 목록
          </button>
        </div>
        <div class="nd-body">
          <div class="nd-tag" id="dTag"></div>
          <div class="nd-title" id="dTitle"></div>
          <div class="nd-time" id="dTime"></div>
          <div class="nd-content" id="dContent"></div>
        </div>
      </div>
    </div>
  </div>

</div><!-- /phone -->

<script>
/* ═══════════════════════════════
   DATA
═══════════════════════════════ */

const NOTIFS = [
  /* ── C-01 networking_chat_request ── */
  {
    id: 'n1',
    type: 'networking_chat_request',
    iconClass: 'blue',
    title: '새로운 대화 신청',
    desc: '김민준(삼성전자)님이 대화를 신청했어요. 매칭 점수 87%',
    sender: null,
    time: '3분 전',
    isRead: false,
  },
  /* ── C-02 networking_chat_accepted ── */
  {
    id: 'n2',
    type: 'networking_chat_accepted',

const readState = {};
NOTIFS.forEach(n => { readState[n.id] = n.isRead; });

let currentFilter = 'all';

/* ═══════════════════════════════
   RENDER: 알림 탭
═══════════════════════════════ */
function renderNotifs() {
  const unreadCount = NOTIFS.filter(n => !readState[n.id]).length;

  // 안읽음 칩 숫자
  const lbl = document.getElementById('unreadLabel');
  lbl.textContent = unreadCount > 0 ? ' ' + unreadCount : '';

  // 모두읽음 버튼
  document.getElementById('markAllBtn').classList.toggle('hidden', unreadCount === 0);

  // 벨 도트 (알림함 헤더 + 데모 패널)
  document.getElementById('mainBellDot').classList.toggle('gone', unreadCount === 0);
  document.getElementById('demoBellDot').classList.toggle('gone', unreadCount === 0);

  // 데모 버튼 텍스트
  const demoBtn = document.getElementById('demoToggleBtn');
  if (unreadCount > 0) {
    demoBtn.textContent = '● 도트 숨기기 (읽음 처리 시뮬레이션)';
  } else {
    demoBtn.textContent = '● 도트 표시하기 (안읽음 시뮬레이션)';
  }

  // 목록 필터링
  let items = currentFilter === 'unread'
    ? NOTIFS.filter(n => !readState[n.id])
    : NOTIFS;

  const list = document.getElementById('notifList');

  if (items.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <div class="empty-title">알림이 없어요</div>
        <div class="empty-desc">새로운 활동이 생기면<br>여기서 알려드릴게요.</div>
      </div>`;
    return;
  }

  list.innerHTML = renderGroup(items);
}

const CHEVRON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

function renderGroup(items) {
  return items.map(n => {
    const isRead = readState[n.id];
    const onclick = n.hasDetail
      ? `openNotifDetail('${n.id}')`
      : `readItem('${n.id}')`;
    const rightCol = (isRead && !n.hasDetail) ? '' : `
      <div class="nitem-right">
        ${!isRead ? `<div class="unread-dot"></div>` : `<div></div>`}
        ${n.hasDetail ? `<div class="nchevron">${CHEVRON}</div>` : `<div></div>`}
      </div>`;
    return `
      <div class="nitem${isRead ? '' : ' unread'}" onclick="${onclick}">
        <div class="nicon ${n.iconClass}">${ICONS[n.type] || ''}</div>
        <div class="nbody">
          <div class="ntitle">${n.title}</div>
          <div class="ndesc">${n.desc}</div>
          <div class="nmeta">
            ${n.sender ? `<span class="nsender">${n.sender}</span><div class="nmeta-dot"></div>` : ''}
            <span class="ntime">${n.time}</span>
          </div>
        </div>
        ${rightCol}
      </div>`;
  }).join('');
}

/* ═══════════════════════════════
   RENDER: 공지 탭
═══════════════════════════════ */
function renderNotices() {
  const pinned  = NOTICES.filter(n => n.isPinned);
  const regular = NOTICES.filter(n => !n.isPinned);

  const NCHEV = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C4CDD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

  const pinnedHtml = pinned.map(n => `
    <div class="ncard pinned" onclick="openDetail('${n.id}')" style="display:flex;align-items:flex-end;gap:8px;">
      <div style="flex:1;min-width:0;">
        <div class="ncard-badge badge-important">중요</div>
        <div class="ncard-title">${n.title}</div>
        <div class="ncard-desc">${n.desc}</div>
        <div class="ncard-time">${n.time}</div>
      </div>
      <div style="flex-shrink:0;">${NCHEV}</div>
    </div>`).join('');

  const regularHtml = regular.map(n => `
    <div class="ncard" onclick="openDetail('${n.id}')" style="display:flex;align-items:flex-end;gap:8px;">
      <div style="flex:1;min-width:0;">
        <div class="ncard-title">${n.title}</div>
        <div class="ncard-desc">${n.desc}</div>
        <div class="ncard-time">${n.time}</div>
      </div>
      <div style="flex-shrink:0;">${NCHEV}</div>
    </div>`).join('');

  let html = '';
  if (pinned.length)  html += `<div class="notice-section-label">중요 공지</div>${pinnedHtml}`;
  if (regular.length) html += `<div class="notice-section-label">일반 공지</div>${regularHtml}`;

  document.getElementById('noticeList').innerHTML = html;
}

/* ═══════════════════════════════
   ACTIONS
═══════════════════════════════ */
function readItem(id) {
  readState[id] = true;
  renderNotifs();
}

function markAllRead() {
  NOTIFS.forEach(n => { readState[n.id] = true; });
  renderNotifs();
}

function setFilter(f) {
  currentFilter = f;
  document.getElementById('fc-all').classList.toggle('active', f === 'all');
  document.getElementById('fc-unread').classList.toggle('active', f === 'unread');
  renderNotifs();
}

function switchTab(tab) {
  ['notif', 'notice'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('tc-' + t).classList.toggle('on', t === tab);
  });
}

function openDetail(id) {
  const n = NOTICES.find(x => x.id === id);
  document.getElementById('dTag').textContent     = n.tagLabel.toUpperCase();
  document.getElementById('dTag').className       = 'nd-tag ' + n.tagClass;
  document.getElementById('dTitle').textContent   = n.title;
  document.getElementById('dTime').textContent    = n.time;
  document.getElementById('dContent').textContent = n.body;
  document.getElementById('noticeDetail').classList.add('open');
}

function closeDetail() {
  document.getElementById('noticeDetail').classList.remove('open');
}

function openNotifDetail(id) {
  readItem(id);
  const n = NOTIFS.find(x => x.id === id);
  document.getElementById('ndTag').textContent     = n.sender || '호스트 공지';
  document.getElementById('ndTitle').textContent   = n.title;
  document.getElementById('ndTime').textContent    = n.time;
  document.getElementById('ndContent').textContent = n.body;
  document.getElementById('notifDetail').classList.add('open');
}

function closeNotifDetail() {
  document.getElementById('notifDetail').classList.remove('open');
}

function toggleDemoDot() {
  // 모두 읽음 처리로 도트 제거 / 되돌리기
  if (demoHasDot) {
    NOTIFS.forEach(n => { readState[n.id] = true; });
  } else {
    NOTIFS.forEach(n => { readState[n.id] = n.isRead; });
  }
  demoHasDot = !demoHasDot;
  renderNotifs();
}

/* ─── Init ─── */
renderNotifs();
renderNotices();
